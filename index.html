    <meta charset="UTF-8" />

    <!-- Static metadata lets sharing services read the card without running the game. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="INTEGRID In Action" />
    <meta property="og:title" content="INTEGRID In Action | Integer Math Adventure" />
    <meta property="og:description" content="Build your integer skills with math crossword puzzles. Solve challenges, unlock levels, and team up in class battles." />
    <meta property="og:url" content="https://integrid-phi.vercel.app/" />
    <meta property="og:image" content="https://integrid-phi.vercel.app/social/integrid-share-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="INTEGRID In Action: an integer crossword with a golden answer tile, a medal, and Relax, Expert, and Battle modes." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INTEGRID In Action | Integer Math Adventure" />
    <meta name="twitter:description" content="Build your integer skills with math crossword puzzles. Solve challenges, unlock levels, and team up in class battles." />
    <meta name="twitter:image" content="https://integrid-phi.vercel.app/social/integrid-share-v1.png" />
    <meta name="twitter:image:alt" content="INTEGRID In Action: an integer crossword with a golden answer tile, a medal, and Relax, Expert, and Battle modes." />
    <meta name="theme-color" content="#ffd34e" />
    <link rel="preload" href="/node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root">
      <main class="loading-screen" role="status" aria-live="polite">
        <div class="loading-card"><p class="loading-brand">INTEGRID <span>IN ACTION</span></p>
          <div class="loading-grid" aria-hidden="true"><span>−3</span><span>+</span><span class="loading-answer">?</span><span>=</span><span>2</span></div>
          <h1>Getting your adventure ready</h1><p id="startup-message">Your next challenge is on its way.</p>
          <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span><small>One box. One step closer.</small>
          <button class="loading-retry" id="startup-retry" type="button" hidden>Try again</button>
        </div>
      </main>
    </div>
    <noscript><p>Enable JavaScript to play INTEGRID. Your progress stays saved on this device.</p></noscript>
    <script>
      (() => {
        const retry = document.getElementById('startup-retry');
        const message = document.getElementById('startup-message');
        const slow = () => { if (retry && retry.isConnected) { retry.hidden = false; message.textContent = 'Taking a little longer. Check your connection and try again.'; } };
        const timer = setTimeout(slow, 12000);
        retry.onclick = () => location.reload();
        addEventListener('integrid:ready', () => clearTimeout(timer), { once: true });
        addEventListener('error', event => { if (event.target && event.target.tagName === 'SCRIPT') slow(); }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
